[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maa-arknights-mcp"
version = "0.1.0"
description = "MCP server for MAA (MaaAssistantArknights) CLI - Automate Arknights gameplay via AI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "MAA Arknights MCP", email = "maa-arknights-mcp@example.com" }
]
keywords = ["mcp", "maa", "arknights", "automation", "game", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastmcp>=2.0.0",
]

[project.scripts]
maa-arknights-mcp = "maa_arknights_mcp.__main__:main"
maa-arknights-mcp-server = "maa_arknights_mcp.__main__:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["maa_arknights_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
